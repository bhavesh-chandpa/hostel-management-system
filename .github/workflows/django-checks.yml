name: Django checks

on:
  push:
    branches: [main, mvp-completion]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-for-deployment
      DJANGO_DEBUG: "False"
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: ${{ github.workspace }}/ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
      - name: Check migration state
        run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: python manage.py test
      - name: Package source archive
        if: success()
        run: git archive --format=zip --output=hostel-management-system-mvp.zip HEAD
      - name: Upload project ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hostel-management-system-mvp
          path: hostel-management-system-mvp.zip
          if-no-files-found: error
